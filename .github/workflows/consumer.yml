name: Consumer integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  consume:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build from source
        run: cmake -S tests/consumer -B build/source -DLTOOL_SOURCE="${{ github.workspace }}"
      - run: cmake --build build/source --config Release
      - run: ctest --test-dir build/source -C Release --output-on-failure
      - run: cmake --install build/source --config Release --prefix "${{ github.workspace }}/build/prefix"
      - name: Use installed package
        run: cmake -S tests/consumer -B build/package -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/prefix"
      - run: cmake --build build/package --config Release
      - run: ctest --test-dir build/package -C Release --output-on-failure
      - name: Check direct headers and installed Asio implementation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          c++ -std=c++20 -I. tests/consumer/main.cpp -o build/direct
          build/direct
          printf '#include "LString.hpp"\n' | c++ -std=c++11 -I. -x c++ -fsyntax-only -
          printf '#include "LWeb.hpp"\n' | c++ -std=c++20 -Ibuild/prefix/include/ltool -x c++ -E - -o /dev/null
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y catch2 libjsoncpp-dev nlohmann-json3-dev g++-14
      - run: cmake -S tests -B build/tests -G Ninja -DCMAKE_CXX_COMPILER=g++-14
      - run: cmake --build build/tests --parallel 2
      - run: ctest --test-dir build/tests --output-on-failure
  module:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install llvm catch2 ninja
      - run: cmake -S tests -B build/module -G Ninja -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" -DLTOOL_BUILD_MODULE=ON
      - run: cmake --build build/module --target LModule_test
      - run: ctest --test-dir build/module --output-on-failure
  windows-process:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: vcpkg install catch2:x64-windows
      - run: cmake -S tests -B build/tests -DLTOOL_PROCESS_TEST_ONLY=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build/tests --config Release --target LProcess_test
      - run: ctest --test-dir build/tests -C Release --output-on-failure
